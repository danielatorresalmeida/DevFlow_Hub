# Copy this file to application-local.properties only for local use.
# Never commit a real database password.

spring.datasource.url=jdbc:postgresql://localhost:5432/devflow_hub
spring.datasource.username=postgres
spring.datasource.password=PUT_YOUR_PASSWORD_HERE
spring.jpa.show-sql=true

# Local object storage. The directory is created automatically.
storage.object.provider=local
storage.object.local.root-directory=./data/object-storage
