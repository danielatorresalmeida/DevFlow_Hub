# Application
spring.application.name=devflow-hub
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devflow_hub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# The SQL script is the source of truth for the database structure.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
# JWT_SECRET must be a Base64-encoded secret containing at least 32 decoded bytes.
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:https://devflow-hub.local}
security.jwt.expiration=${JWT_EXPIRATION:PT15M}

# Object storage
storage.object.provider=${OBJECT_STORAGE_PROVIDER:local}
storage.object.local.root-directory=${OBJECT_STORAGE_LOCAL_ROOT_DIRECTORY:./data/object-storage}

# Avoid exposing internal exception details in default error pages.
server.error.include-message=never
