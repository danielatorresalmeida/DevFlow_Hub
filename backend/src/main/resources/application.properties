# Application
spring.application.name=devflow-hub
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devflow_hub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# The SQL script is the source of truth for the database structure.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf cache stays disabled during local development.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Avoid exposing internal exception details in default error pages.
server.error.include-message=never
